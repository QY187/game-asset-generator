[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesage"
version = "0.1.0"
description = "AI-powered Pull Request Reviewer"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CodeSage Team", email = "team@codesage.ai" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.2",
    "flet>=0.85.0",
]

[project.scripts]
codesage = "codesage.cli.main:app"
codesage-gui = "codesage.gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codesage*"]
